name: Verify Profession Fabric foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Professional Body foundation
        run: npm test
