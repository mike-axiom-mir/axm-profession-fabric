name: Deterministic code workflow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  code-workflow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: '20'
            python: '3.11'
          - node: '22'
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
        with:
          path: fabric
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-102-grammer
          ref: 6e9efc2ebf759f9e2d03c933eafaf71856357471
          path: grammar
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise professions with real generated JavaScript and Python
        working-directory: fabric
        env:
          AXM_CODE_COMPILER: ../grammar
        run: npm run test:code
